syntax = "proto3";

package jaumemory.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// CredentialService — secure credential vault operations.
// NOTE: There is intentionally NO InjectCredential RPC.
// Credential injection is a private in-process Rust method (pub(crate)),
// never exposed over the network.
service CredentialService {
  // Store a new API credential (encrypted at rest)
  rpc StoreCredential(StoreCredentialRequest) returns (Credential);

  // List credentials for the authenticated user (masked values)
  rpc ListCredentials(ListCredentialsRequest) returns (CredentialList);

  // Get a single credential by ID (masked value)
  rpc GetCredential(GetCredentialRequest) returns (Credential);

  // Update credential metadata (not the secret itself — use Rotate for that)
  rpc UpdateCredential(UpdateCredentialRequest) returns (Credential);

  // Delete a credential (soft delete)
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty);

  // Rotate the secret value of a credential
  rpc RotateCredential(RotateCredentialRequest) returns (Credential);

  // Verify a credential is still valid (e.g. test API key)
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialResponse);

  // Get access log entries for a credential
  rpc GetAccessLog(GetAccessLogRequest) returns (AccessLogList);

  // Get provider presets (OpenAI, Stripe, etc.)
  rpc GetProviderPresets(google.protobuf.Empty) returns (ProviderPresetList);
}

// ─────────────────────────────────────────────
// Core credential message (RESPONSE ONLY)
// NOTE: Never contains plaintext secrets.
// ─────────────────────────────────────────────

message Credential {
  string id = 1;
  string name = 2;
  string slug = 3;
  optional string description = 4;
  optional string provider = 5;
  string credential_type = 6;        // api_key, bearer_token, basic_auth, oauth2, custom_header

  // Masked preview — e.g. "sk-...xyz1" — NEVER the full secret
  string masked_value = 7;

  // Injection configuration
  string auth_header = 8;
  string auth_prefix = 9;
  string injection_method = 10;      // header, query, body, url
  optional string injection_key = 11;

  // Status
  bool is_active = 12;
  optional google.protobuf.Timestamp expires_at = 13;
  optional google.protobuf.Timestamp last_used_at = 14;
  optional google.protobuf.Timestamp last_rotated_at = 15;
  optional int32 rotation_reminder_days = 16;

  // Metadata
  repeated string scopes = 17;
  optional string notes = 18;

  // Timestamps
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// ─────────────────────────────────────────────
// Request messages
// NOTE: user_id is NEVER a request field — always
// extracted from gRPC interceptor metadata.
// ─────────────────────────────────────────────

message StoreCredentialRequest {
  string name = 1;
  optional string description = 2;
  optional string provider = 3;
  string credential_type = 4;

  // Write-only: the actual secret. Never returned in any response.
  string value = 5;
  optional string secondary_value = 6;    // e.g. client_secret for OAuth2

  // Injection config
  optional string auth_header = 7;
  optional string auth_prefix = 8;
  optional string injection_method = 9;
  optional string injection_key = 10;

  // Optional metadata
  optional int32 rotation_reminder_days = 11;
  repeated string scopes = 12;
  optional string notes = 13;
}

message ListCredentialsRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional string provider = 3;
  optional string credential_type = 4;
  optional bool active_only = 5;
}

message GetCredentialRequest {
  string credential_id = 1;
}

message UpdateCredentialRequest {
  string credential_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string provider = 4;

  // Injection config updates
  optional string auth_header = 5;
  optional string auth_prefix = 6;
  optional string injection_method = 7;
  optional string injection_key = 8;

  // Status updates
  optional bool is_active = 9;
  optional google.protobuf.Timestamp expires_at = 10;
  optional int32 rotation_reminder_days = 11;
  repeated string scopes = 12;
  optional string notes = 13;
}

message DeleteCredentialRequest {
  string credential_id = 1;
}

message RotateCredentialRequest {
  string credential_id = 1;
  // Write-only: the new secret value. Never returned in any response.
  string new_value = 2;
  optional string new_secondary_value = 3;
}

message VerifyCredentialRequest {
  string credential_id = 1;
}

message VerifyCredentialResponse {
  bool is_valid = 1;
  optional string status_message = 2;
  optional int32 http_status = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message GetAccessLogRequest {
  string credential_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  optional string action = 4;     // filter by action type
}

// ─────────────────────────────────────────────
// Response/list messages
// ─────────────────────────────────────────────

message CredentialList {
  repeated Credential credentials = 1;
  int32 total = 2;
}

message AccessLogEntry {
  string id = 1;
  optional string credential_id = 2;   // NULL if parent was hard-deleted
  string action = 3;
  optional string tool_id = 4;
  optional string ip_address = 5;
  optional string user_agent = 6;
  map<string, string> metadata = 7;
  google.protobuf.Timestamp created_at = 8;
}

message AccessLogList {
  repeated AccessLogEntry entries = 1;
  int32 total = 2;
}

message ProviderPreset {
  string provider = 1;
  string display_name = 2;
  string default_auth_header = 3;
  string default_auth_prefix = 4;
  string default_credential_type = 5;
  optional string base_url = 6;
  optional string docs_url = 7;
}

message ProviderPresetList {
  repeated ProviderPreset presets = 1;
}
